[project]
name = "sketchwright"
version = "0.1.0"
description = "Deterministic Excalidraw MCP diagram agent and layout engine"
readme = "README.md"
authors = [
    { name = "manoj-025", email = "code.me.025@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.14.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
keywords = ["mcp", "excalidraw", "diagrams", "architecture", "layout-engine"]

[project.urls]
Homepage = "https://github.com/manoj-025/sketchwright-mcp"
Repository = "https://github.com/manoj-025/sketchwright-mcp"
Documentation = "https://github.com/manoj-025/sketchwright-mcp/tree/main/docs"
"Bug Tracker" = "https://github.com/manoj-025/sketchwright-mcp/issues"


[project.scripts]
sketchwright = "sketchwright.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
