[project]
name = "sketchwright"
version = "0.1.0"
description = "Deterministic Excalidraw MCP diagram agent and layout engine"
readme = "README.md"
authors = [
    { name = "manoj-025", email = "code.me.025@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.14.0",
]

[project.scripts]
sketchwright = "sketchwright.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
