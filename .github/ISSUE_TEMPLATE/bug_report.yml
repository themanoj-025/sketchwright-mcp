name: Bug Report
description: Create a report to help us improve Sketchwright
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below with reproduction details.
  - type: textarea
    id: problem-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or code snippet to reproduce the behavior.
      placeholder: |
        1. Run CLI command: `uv run sketchwright generate ...`
        2. Or Python code snippet:
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and Sketchwright version.
      placeholder: Windows 11 / Ubuntu 24.04, Python 3.12, sketchwright 0.1.0
    validations:
      required: true
